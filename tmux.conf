# ~/.tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn' 
set -g @rose_pine_user 'on' # Turn on the username component in the statusbar

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB" # Enable true color
set -g base-index 1                            # Start windows at 1
set -g mouse on                                # Enable mouse support
set-window-option -g xterm-keys on
set -s set-clipboard on
set -g allow-passthrough on
set -g status-left-length 100
set -g status-justify centre


#set -g status-left '#[fg=#{@rose_pine_base},bg=#{@rose_pine_foam},bold] #{W} #[fg=#{@rose_pine_foam},bg=default,nobold]'

# --- Rosé Pine Main Colors ---
# Base: #191724 | Surface: #1f1d2e | Overlay: #26233a
# Muted: #6e6a86 | Subtle: #908caa  | Text: #e0def4
# Love: #eb6f92  | Gold: #f6c177    | Rose: #ebbcba
# Pine: #31748f  | Foam: #9ccfd8    | Iris: #c4a7e7

# Status bar general
set -g status-style 'bg=#191724,fg=#e0def4'
set -g status-left-length 30
set -g status-left "#[fg=#191724,bg=#c4a7e7,bold] #S #[fg=#c4a7e7,bg=default] "

# Right side: Date and Time
set -g status-right "#[fg=#908caa,bg=default] %Y-%m-%d #[fg=#ebbcba,bg=default] %H:%M "

# --- Window Information ---
# Inactive windows
set -g window-status-format "#[fg=#6e6a86,bg=default] #I:#W "

# Current active window
set -g window-status-current-format "#[fg=#191724,bg=#ebbcba,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#ebbcba"

# Message style
set -g message-style "fg=#e0def4,bg=#1f1d2e"

run '~/.tmux/plugins/tpm/tpm'
